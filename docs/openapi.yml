openapi: 3.1.0
info:
  title: PLA Premium Shop API
  version: 0.1.0
  description: |
    REST API for the PLA Premium Shop MVP (Phillip Life branded merchandise).
    All product data, prices and stock levels are mock values.

    Money amounts are whole Thai baht (THB) as integers.

    Admin endpoints (`PUT /products/{id}`, `GET /orders`) need the `pla_admin`
    session cookie from `POST /admin/session` (single shared password from the
    `ADMIN_PASSWORD` env var). Shopper endpoints are public.
servers:
  - url: http://localhost:3000/api
    description: Local dev server

# Public by default; admin operations declare `adminSession` below.
security: []

tags:
  - name: products
    description: Merchandise catalogue (sample data).
  - name: orders
    description: Checkout and the admin order list.
  - name: admin
    description: Admin login session.
  - name: logs
    description: Click log written by the browser (basic data only).

paths:
  /products:
    get:
      tags: [products]
      operationId: listProducts
      summary: List products
      parameters:
        - name: category
          in: query
          required: false
          description: Filter by category name (exact match, Thai), e.g. `ไลฟ์สไตล์`.
          schema:
            type: string
      responses:
        "200":
          description: Products ordered by display order.
          content:
            application/json:
              schema:
                type: object
                required: [products]
                properties:
                  products:
                    type: array
                    items:
                      $ref: "#/components/schemas/Product"

  /products/{id}:
    parameters:
      - $ref: "#/components/parameters/ProductId"
    get:
      tags: [products]
      operationId: getProduct
      summary: Get one product
      responses:
        "200":
          description: The product.
          content:
            application/json:
              schema:
                type: object
                required: [product]
                properties:
                  product:
                    $ref: "#/components/schemas/Product"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [products]
      operationId: updateProduct
      summary: Update a product (admin)
      security:
        - adminSession: []
      description: |
        Replaces the editable fields of a product. `id` and `category` are not editable.
        An empty `tag` removes the badge. An empty `options` list is stored as `["มาตรฐาน"]`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: The updated product.
          content:
            application/json:
              schema:
                type: object
                required: [product]
                properties:
                  product:
                    $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /orders:
    get:
      tags: [orders]
      operationId: listOrders
      summary: List orders, newest first (admin)
      security:
        - adminSession: []
      responses:
        "200":
          description: Orders with their line items.
          content:
            application/json:
              schema:
                type: object
                required: [orders]
                properties:
                  orders:
                    type: array
                    items:
                      $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [orders]
      operationId: createOrder
      summary: Place an order from the cart
      description: |
        Prices are always taken from the database, never from the client.
        In one transaction the server:
        1. validates every product exists, every option is valid and stock is sufficient,
        2. decrements stock,
        3. creates the order with number `PLA-<year>-<5 digits>` (running per year)
           and status `PENDING_PAYMENT` (รอชำระเงิน).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCreate"
      responses:
        "201":
          description: Order created.
          content:
            application/json:
              schema:
                type: object
                required: [order]
                properties:
                  order:
                    $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          description: Not enough stock, or a product/option no longer exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /log:
    post:
      tags: [logs]
      operationId: logClicks
      summary: Record button/link clicks
      description: |
        Called by `instrumentation-client.ts` with `navigator.sendBeacon`. Public (shoppers are
        not logged in). Stores type, label, destination, page and time only: never typed text,
        IP address, user agent or any session id. Strings longer than their limit are truncated.
        There is no rate limiting yet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClickLogBatch"
      responses:
        "204":
          description: Stored.
        "400":
          $ref: "#/components/responses/ValidationError"

  /admin/session:
    post:
      tags: [admin]
      operationId: adminLogin
      summary: Log in to admin
      description: |
        Checks the password against the `ADMIN_PASSWORD` env var and sets an
        HttpOnly `pla_admin` cookie valid for 8 hours. Changing the password ends all sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password:
                  type: string
                  minLength: 1
                  maxLength: 200
      responses:
        "204":
          description: Logged in; `Set-Cookie` carries the session.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: "`pla_admin=<expiry>.<signature>; HttpOnly; SameSite=Lax; Path=/`"
        "401":
          description: Wrong password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Admin login disabled because `ADMIN_PASSWORD` is not set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [admin]
      operationId: adminLogout
      summary: Log out of admin
      responses:
        "204":
          description: Session cookie cleared.

components:
  securitySchemes:
    adminSession:
      type: apiKey
      in: cookie
      name: pla_admin
      description: Session cookie set by `POST /admin/session`.

  parameters:
    ProductId:
      name: id
      in: path
      required: true
      description: Product slug, e.g. `umbrella`.
      schema:
        type: string

  responses:
    Unauthorized:
      description: Admin login required.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: Request body failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    ClickLogBatch:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/ClickEvent"

    ClickEvent:
      type: object
      additionalProperties: false
      required: [type, label, page, at]
      properties:
        type:
          type: string
          enum: [link, button, tab]
        label:
          type: string
          maxLength: 80
          description: aria-label, else visible text. Truncated to 80 characters.
        href:
          type: [string, "null"]
          maxLength: 300
          description: Internal path + query, or the origin of an external link. No hash.
        page:
          type: string
          maxLength: 200
          description: Pathname where the click happened (no query).
        disabled:
          type: boolean
        at:
          type: string
          format: date-time
          description: Client clock.

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable message (Thai).
          examples: ["สินค้าคงเหลือไม่พอ"]
        issues:
          type: array
          description: Field-level validation problems, when applicable.
          items:
            type: object
            required: [path, message]
            properties:
              path:
                type: string
                examples: ["address.postalCode"]
              message:
                type: string

    Product:
      type: object
      required: [id, name, description, price, category, options, stock, tag, imageUrl]
      properties:
        id:
          type: string
          examples: ["umbrella"]
        name:
          type: string
          examples: ["ร่มพับอัตโนมัติ PLA"]
        description:
          type: string
        price:
          type: integer
          minimum: 0
          description: Unit price in whole THB.
          examples: [390]
        category:
          type: string
          examples: ["ไลฟ์สไตล์"]
        options:
          type: array
          minItems: 1
          items:
            type: string
          examples: [["กรมท่า", "ส้ม"]]
        stock:
          type: integer
          minimum: 0
        tag:
          type: ["string", "null"]
          description: Badge text, e.g. `ขายดี` or `ใหม่`.
        imageUrl:
          type: ["string", "null"]
          description: |
            Site-relative path of the product illustration (served from `public/`),
            e.g. `/products/umbrella.svg`. `null` = show the brand placeholder.
            Illustrations only, not product photos. Not editable via the API yet.
          examples: ["/products/umbrella.svg"]

    ProductUpdate:
      type: object
      additionalProperties: false
      required: [name, description, price, stock, tag, options]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 1000
        price:
          type: integer
          minimum: 0
          maximum: 1000000
        stock:
          type: integer
          minimum: 0
          maximum: 1000000
        tag:
          type: ["string", "null"]
          maxLength: 30
        options:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 40

    ShippingMethod:
      type: string
      enum: [standard, express]
      description: |
        `standard` = มาตรฐาน 3–5 วันทำการ, ฿50 ·
        `express` = ด่วน 1–2 วันทำการ, ฿90

    PaymentMethod:
      type: string
      enum: [promptpay, cod]
      description: "`promptpay` = PromptPay QR (mock), `cod` = เก็บเงินปลายทาง"

    OrderStatus:
      type: string
      enum: [PENDING_PAYMENT]
      description: "`PENDING_PAYMENT` = รอชำระเงิน. More statuses come with payment integration."

    Address:
      type: object
      additionalProperties: false
      required: [recipientName, phone, address, province, postalCode]
      properties:
        recipientName:
          type: string
          minLength: 1
          maxLength: 120
          description: ชื่อผู้รับ
        phone:
          type: string
          pattern: "^0[0-9]{8,9}$"
          description: เบอร์โทรศัพท์ (Thai number, digits only, 9–10 digits starting with 0)
        address:
          type: string
          minLength: 1
          maxLength: 300
          description: ที่อยู่
        province:
          type: string
          minLength: 1
          maxLength: 80
          description: จังหวัด
        postalCode:
          type: string
          pattern: "^[0-9]{5}$"
          description: รหัสไปรษณีย์

    OrderCreate:
      type: object
      additionalProperties: false
      required: [items, address, shippingMethod, paymentMethod]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [productId, option, quantity]
            properties:
              productId:
                type: string
              option:
                type: string
              quantity:
                type: integer
                minimum: 1
                maximum: 999
        address:
          $ref: "#/components/schemas/Address"
        shippingMethod:
          $ref: "#/components/schemas/ShippingMethod"
        paymentMethod:
          $ref: "#/components/schemas/PaymentMethod"

    OrderItem:
      type: object
      required: [productId, productName, option, unitPrice, quantity, lineTotal]
      properties:
        productId:
          type: string
        productName:
          type: string
          description: Product name at the time of ordering.
        option:
          type: string
        unitPrice:
          type: integer
          description: Unit price (THB) at the time of ordering.
        quantity:
          type: integer
        lineTotal:
          type: integer

    Order:
      type: object
      required:
        - number
        - status
        - createdAt
        - address
        - shippingMethod
        - shippingFee
        - paymentMethod
        - subtotal
        - total
        - itemCount
        - items
      properties:
        number:
          type: string
          pattern: "^PLA-[0-9]{4}-[0-9]{5}$"
          examples: ["PLA-2026-00001"]
        status:
          $ref: "#/components/schemas/OrderStatus"
        createdAt:
          type: string
          format: date-time
        address:
          $ref: "#/components/schemas/Address"
        shippingMethod:
          $ref: "#/components/schemas/ShippingMethod"
        shippingFee:
          type: integer
        paymentMethod:
          $ref: "#/components/schemas/PaymentMethod"
        subtotal:
          type: integer
        total:
          type: integer
        itemCount:
          type: integer
          description: Sum of item quantities.
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
